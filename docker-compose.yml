services:
  # Base de Datos Relacional Principal (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: gestion-firmas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_firmas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gestion_firmas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestion-firmas-net

  # Caché Efímera y Colas BullMQ (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: gestion-firmas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestion-firmas-net

  # Object Storage de Evidencias y Documentos Firmados (MinIO S3)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: gestion-firmas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - gestion-firmas-net

  # Backend Core (NestJS + TypeScript + Prisma + Socket.io + BullMQ)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion-firmas-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-gestion_firmas}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PRESENCE_TTL: 3600
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-coquimbo_secret_key_2026}
      TELEMETRIA_API_KEY: ${TELEMETRIA_API_KEY:-ghost_app_key_2026}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gestion-firmas-net

  # Reverse Proxy & Gateway de Seguridad (Nginx Gateway)
  gateway:
    image: nginx:alpine
    container_name: gestion-firmas-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - gestion-firmas-net

networks:
  gestion-firmas-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
