services:
  # Base de Datos Relacional Principal (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: gestion-firmas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_firmas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gestion_firmas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - gestion-firmas-net

  # Caché Efímera y Colas BullMQ (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: gestion-firmas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - gestion-firmas-net

  # Object Storage de Evidencias y Documentos Firmados (MinIO S3)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: gestion-firmas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    networks:
      - gestion-firmas-net

  # Backend Core (NestJS + TypeScript + Prisma + Socket.io + BullMQ)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion-firmas-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-gestion_firmas}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PRESENCE_TTL: 3600
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-coquimbo_secret_key_2026}
      TELEMETRIA_API_KEY: ${TELEMETRIA_API_KEY:-ghost_app_key_2026}
      HMAC_SECRET: ${HMAC_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_INICIAL_RUT: ${ADMIN_INICIAL_RUT:-}
      ADMIN_INICIAL_NOMBRE: ${ADMIN_INICIAL_NOMBRE:-}
      ADMIN_INICIAL_EMAIL: ${ADMIN_INICIAL_EMAIL:-}
      ADMIN_INICIAL_CARGO: ${ADMIN_INICIAL_CARGO:-}
      ADMIN_INICIAL_UNIDAD: ${ADMIN_INICIAL_UNIDAD:-}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-}
      ADMIN_INICIAL_PIN: ${ADMIN_INICIAL_PIN:-}
      FIRMAGOB_API_URL: ${FIRMAGOB_API_URL:-}
      FIRMAGOB_API_TOKEN: ${FIRMAGOB_API_TOKEN:-}
      ESIGN_API_URL: ${ESIGN_API_URL:-}
      ESIGN_API_KEY: ${ESIGN_API_KEY:-}
      CLAVEUNICA_CLIENT_ID: ${CLAVEUNICA_CLIENT_ID:-}
      CLAVEUNICA_CLIENT_SECRET: ${CLAVEUNICA_CLIENT_SECRET:-}
      AD_LDAP_URL: ${AD_LDAP_URL:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 450M
        reservations:
          memory: 180M
    networks:
      - gestion-firmas-net

  # Portal Web React + Tailwind CSS (SPA Frontend)
  frontend:
    build:
      context: ../gestion-de-firmas-frontend
      dockerfile: Dockerfile
    container_name: gestion-firmas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    networks:
      - gestion-firmas-net

  # Reverse Proxy & Gateway de Seguridad SSL/TLS (Nginx Gateway)
  gateway:
    image: nginx:alpine
    container_name: gestion-firmas-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 24M
    networks:
      - gestion-firmas-net

networks:
  gestion-firmas-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_challenge:
