services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-firmas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_firmas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gestion_firmas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - gestion-firmas-net

  redis:
    image: redis:7-alpine
    container_name: gestion-firmas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - gestion-firmas-net

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: gestion-firmas-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-gestion_firmas}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PRESENCE_TTL: ${REDIS_PRESENCE_TTL:-3600}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET}
      TELEMETRIA_API_KEY: ${TELEMETRIA_API_KEY:-CHANGE_ME_TELEMETRIA_API_KEY}
      TOTP_ISSUER: ${TOTP_ISSUER:-Gestion de tokens - I.Municipalidad de Coquimbo}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-Ilustre Municipalidad de Coquimbo}
      DEFAULT_DEPENDENCIA_FISICA: ${DEFAULT_DEPENDENCIA_FISICA:-Red Interna Municipal - Coquimbo}
      ADMIN_INICIAL_RUT: ${ADMIN_INICIAL_RUT:-}
      ADMIN_INICIAL_NOMBRE: ${ADMIN_INICIAL_NOMBRE:-}
      ADMIN_INICIAL_EMAIL: ${ADMIN_INICIAL_EMAIL:-}
      ADMIN_INICIAL_CARGO: ${ADMIN_INICIAL_CARGO:-}
      ADMIN_INICIAL_UNIDAD: ${ADMIN_INICIAL_UNIDAD:-}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-}
      ADMIN_INICIAL_PIN: ${ADMIN_INICIAL_PIN:-}
      EXTRA_SUPERADMINS_JSON: ${EXTRA_SUPERADMINS_JSON:-}
      SUPERADMINS_FIJOS_JSON: ${SUPERADMINS_FIJOS_JSON:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_OFFICE_NAME: ${MAIL_OFFICE_NAME:-Oficina de Transformación Digital}
      MAIL_DEPT_NAME: ${MAIL_DEPT_NAME:-Departamento de Gestión de Sistemas y TICS}
      MAIL_CONTACT_PHONE: ${MAIL_CONTACT_PHONE:-+569 91682880}
      MAIL_CONTACT_EMAIL: ${MAIL_CONTACT_EMAIL:-transformaciondigital@municoquimbo.cl}
      MAIL_WEB_URL: ${MAIL_WEB_URL:-municoquimbo.cl}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 450M
        reservations:
          memory: 180M
    networks:
      - gestion-firmas-net

  frontend:
    build:
      context: ../gestion-de-firmas-frontend
      dockerfile: Dockerfile
    container_name: gestion-firmas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    networks:
      - gestion-firmas-net

  gateway:
    image: nginx:alpine
    container_name: gestion-firmas-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 24M
    networks:
      - gestion-firmas-net

networks:
  gestion-firmas-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_challenge:
